<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>marcos dev — portfólio</title>
    <meta name="description" content="Marcos — desenvolvedor web freelancer em Atibaia, SP. Sites e sistemas web feitos sob medida." />
    <meta name="theme-color" content="#FAFAF8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1115" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/assets/marca/logo/svg/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/marca/logo/png/favicon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap" />
    <script>
      // Aplica o tema antes da renderização para evitar o "piscar" de cores
      try {
        const salvo = localStorage.getItem('tema')
        const escuro = salvo ? salvo === 'escuro' : matchMedia('(prefers-color-scheme: dark)').matches
        if (escuro) document.documentElement.dataset.theme = 'dark'
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
