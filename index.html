<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>marcos dev — portfólio</title>
    <meta name="description" content="Marcos — desenvolvedor web freelancer em Atibaia, SP. Sites, sistemas e automações sob medida para o seu negócio." />
    <meta name="theme-color" content="#FAFAF8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1115" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/assets/marca/logo/svg/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/marca/logo/png/favicon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap" />
    <script>
      // Aplica o tema antes da renderização para evitar o "piscar" de cores
      try {
        const salvo = localStorage.getItem('tema')
        const escuro = salvo ? salvo === 'escuro' : matchMedia('(prefers-color-scheme: dark)').matches
        if (escuro) document.documentElement.dataset.theme = 'dark'
      } catch {}
      // Abertura com a logo: toda vez que a página carrega, exceto com movimento reduzido (ver src/components/Intro.jsx)
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.dataset.intro = ''
      // Se algum erro impedir o site de carregar, mostra o erro na tela em vez de deixar a página em branco
      addEventListener('error', function (e) {
        var alvo = e.target && e.target.tagName
        if (alvo && alvo !== 'SCRIPT') return
        var raiz = document.getElementById('root')
        if (raiz && raiz.childElementCount) return
        document.body.insertAdjacentHTML('beforeend', '<pre style="white-space:pre-wrap;padding:16px;font:13px monospace;color:#b91c1c">Erro ao carregar: ' + (e.message || (e.target && (e.target.src || e.target.href)) || 'desconhecido') + '</pre>')
      }, true)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
